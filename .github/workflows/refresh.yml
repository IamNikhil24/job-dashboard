name: Refresh jobs
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
        continue-on-error: true
      - run: python scrape.py
      - name: Commit updated jobs file
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || (git commit -m "Refresh jobs" && git push)
