<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDE-1 jobs in India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f8fb;--panel:#fff;--ink:#14213d;--mute:#5b6a82;--line:#dfe5ee;--accent:#2b3a8f;--new:#b87800;--ok:#17724d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:28px 24px 8px;max-width:1200px;margin:auto}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);margin-top:4px}
main{max-width:1200px;margin:auto;padding:16px 24px 48px;display:grid;grid-template-columns:240px 1fr;gap:24px}
aside{position:sticky;top:12px;align-self:start;display:grid;gap:14px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font:inherit;color:var(--mute);cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.row{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.row.done{opacity:.55}
.co{font-weight:600}.co small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.title{font-weight:500}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kw span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mute)}
.new{color:var(--new);font-weight:600;font-size:12px;margin-left:6px}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
a.btn,button.btn{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;border:1px solid var(--accent);display:inline-block}
a.btn{background:var(--accent);color:#fff}button.btn{background:transparent;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:40px;text-align:center;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--mute);font-weight:500}
.s-ok{color:var(--ok)}.s-failed{color:var(--bad)}td a{color:var(--accent)}.err{display:block;font-size:12px;color:var(--mute);max-width:420px;overflow-wrap:anywhere}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static}.row{grid-template-columns:1fr}.act{justify-content:flex-start}}
</style>
</head>
<body>
<header>
  <h1>SDE-1 openings in India</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<main>
  <aside>
    <div><label for="q">Search title, company or keyword</label><input type="search" id="q" placeholder="e.g. Java, Razorpay"></div>
    <div><label>Company type</label><div class="chips" id="types"></div></div>
    <div><label for="city">City</label><select id="city"><option value="">All cities</option></select></div>
    <label class="chk"><input type="checkbox" id="onlyNew"> Only new in the last 24 hours</label>
    <label class="chk"><input type="checkbox" id="hideUnstated"> Only jobs that state ≤ 2 years</label>
    <label class="chk"><input type="checkbox" id="hideApplied"> Hide jobs I’ve applied to</label>
  </aside>
  <section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="jobs">Jobs</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cos">Companies</button>
    </div>
    <div id="out"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let D = {jobs:[], companies:[], generated_at:null}, applied = store.get("applied") || {};
const F = {q:"", type:"", city:"", onlyNew:false, hideApplied:false, hideUnstated:false, tab:"jobs"};

function tailorPrompt(j){
  return `Tailor my resume for the job below. Use the resume saved in this project (or the one I attach).

Company: ${j.company} (${j.type})
Role: ${j.title}
Job ID: ${j.ext_id}
Location: ${j.location}
Experience asked: ${j.exp}
Apply link: ${j.url}
Keywords found in the posting: ${j.keywords.join(", ") || "none detected"}

Job description:
${j.desc || "(not available, use the role title and keywords)"}

Rules:
1. Use only my real experience. Never invent skills, tools, employers or numbers.
2. Reword and reorder my existing bullets so the most relevant work comes first and matches the posting’s language.
3. I have about 2 years of experience (SDE-1 level). Keep the tone and scope realistic for that.
4. ATS-friendly: single column, standard headings, no tables, images or icons. One page.
5. Give me: (a) the tailored resume as a downloadable .docx, (b) a short list of what you changed, (c) keywords from the posting my resume does not cover, so I can decide whether I genuinely have them.`;
}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3500)}
async function tailor(id){
  const j = D.jobs.find(x=>x.id===id), p = tailorPrompt(j);
  try{await navigator.clipboard.writeText(p); toast("Prompt copied. If Claude opens empty, just paste it.")}catch{toast("Opening Claude with the prompt")}
  window.open("https://claude.ai/new?q=" + encodeURIComponent(p.slice(0,3500)), "_blank", "noopener");
}
function isNew(j){return Date.now() - new Date(j.first_seen) < 864e5}
function ago(iso){if(!iso)return"never";const h=Math.round((Date.now()-new Date(iso))/36e5);return h<1?"under an hour ago":h<48?h+" hours ago":Math.round(h/24)+" days ago"}

function filtered(){
  const q = F.q.toLowerCase();
  return D.jobs.filter(j =>
    (!F.type || j.type===F.type) && (!F.city || j.city===F.city) && (!F.onlyNew || isNew(j)) && !(F.hideApplied && applied[j.id]) && !(F.hideUnstated && j.exp==="Not stated") &&
    (!q || (j.title+" "+j.company+" "+j.keywords.join(" ")).toLowerCase().includes(q)));
}
function render(){
  const out = $("#out");
  if(F.tab==="cos"){
    out.innerHTML = D.companies.length ? `<table><tr><th>Company</th><th>Type</th><th>How it’s read</th><th>Jobs</th><th>Careers site</th></tr>` +
      D.companies.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td>
      <td class="s-${c.status}">${c.status==="ok"?(c.method==="feed"?"Live feed":"Read from page")+(c.system?" ("+esc(c.system)+")":""):"Failed"}${c.status==="failed"&&c.error?`<span class="err">${esc(c.error)}</span>`:""}</td>
      <td>${c.count}</td><td><a href="${esc(c.url)}" target="_blank" rel="noopener">Open</a></td></tr>`).join("") + `</table>`
      : `<div class="empty">No data yet. Run the “Refresh jobs” workflow once from the Actions tab.</div>`;
    return;
  }
  const list = filtered();
  if(!list.length){ out.innerHTML = `<div class="empty">${D.jobs.length ? "No jobs match these filters. Try clearing one." : "No jobs yet. Run the “Refresh jobs” workflow once from the Actions tab, then reload this page."}</div>`; return; }
  out.innerHTML = list.map(j=>`<div class="row ${applied[j.id]?"done":""}">
    <div class="co">${esc(j.company)}<small>${esc(j.type)}</small></div>
    <div><div class="title">${esc(j.title)}${isNew(j)?'<span class="new">New</span>':""}</div>
      <div class="meta">${esc(j.location)} · Experience: ${esc(j.exp)}</div>
      <div class="kw">${j.keywords.slice(0,8).map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>
    <div class="act"><label class="chk"><input type="checkbox" data-applied="${j.id}" ${applied[j.id]?"checked":""}> Applied</label>
      <button class="btn" data-tailor="${j.id}">Tailor resume</button>
      <a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Apply</a></div></div>`).join("");
}
function init(){
  const types=[...new Set(D.companies.map(c=>c.type))], cities=[...new Set(D.jobs.map(j=>j.city).filter(Boolean))].sort();
  $("#types").innerHTML = types.map(t=>`<button class="chip" aria-pressed="false" data-type="${esc(t)}">${esc(t)}</button>`).join("");
  $("#city").innerHTML += cities.map(c=>`<option>${esc(c)}</option>`).join("");
  const ok = D.companies.filter(c=>c.status==="ok").length, bad = D.companies.filter(c=>c.status==="failed").length;
  $("#sub").textContent = D.generated_at ? `${D.jobs.length} jobs from ${ok} companies · updated ${ago(D.generated_at)} · ${bad} scrapers failing · refreshes every 12 hours` : "Waiting for the first refresh";
  render();
}
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-type],[data-tailor],[data-tab]"); if(!t) return;
  if(t.dataset.tailor) tailor(t.dataset.tailor);
  if(t.dataset.tab){F.tab=t.dataset.tab;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b===t))}
  if(t.dataset.type!==undefined){F.type=F.type===t.dataset.type?"":t.dataset.type;document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.type===F.type))}
  render();
});
document.addEventListener("change", e=>{
  if(e.target.dataset.applied){applied[e.target.dataset.applied]=e.target.checked||undefined;store.set("applied",applied)}
  if(e.target.id==="city")F.city=e.target.value; if(e.target.id==="onlyNew")F.onlyNew=e.target.checked; if(e.target.id==="hideApplied")F.hideApplied=e.target.checked; if(e.target.id==="hideUnstated")F.hideUnstated=e.target.checked;
  render();
});
$("#q").addEventListener("input", e=>{F.q=e.target.value;render()});
fetch("jobs.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;init()}).catch(()=>{$("#sub").textContent="Could not load jobs.json";});
</script>
</body>
</html>
